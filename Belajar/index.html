<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <header>
      <nav class="d-flex p-2 bg-primary">
        <div class="logo me-5">
          <h2><i class="fa-solid fa-calculator text-white"></i></h2>
        </div>
        <div class="heading text-white">
          <h2>Web Calculator</h2>
        </div>
      </nav>
    </header>

    <main>
      <div class="container d-flex justify-content-center align-content-center">
        <div class="card" style="width: 60%">
          <div class="label">
            <h1 id="label" class="text-end">0</h1>
          </div>
          <div class="card-body d-flex flex-wrap justify-content-center">
            <button id="1" class="btn btn-primary col-3 m-2 py-4">
              <h2>1</h2>
            </button>
            <button id="2" class="btn btn-primary col-3 m-2 py-4">
              <h2>2</h2>
            </button>
            <button id="3" class="btn btn-primary col-3 m-2 py-4">
              <h2>3</h2>
            </button>
            <button id="4" class="btn btn-primary col-3 m-2 py-4">
              <h2>4</h2>
            </button>
            <button id="5" class="btn btn-primary col-3 m-2 py-4">
              <h2>5</h2>
            </button>
            <button id="6" class="btn btn-primary col-3 m-2 py-4">
              <h2>6</h2>
            </button>
            <button id="7" class="btn btn-primary col-3 m-2 py-4">
              <h2>7</h2>
            </button>
            <button id="8" class="btn btn-primary col-3 m-2 py-4">
              <h2>8</h2>
            </button>
            <button id="9" class="btn btn-primary col-3 m-2 py-4">
              <h2>9</h2>
            </button>
            <button id="0" class="btn btn-primary col-3 m-2 py-4">
              <h2>0</h2>
            </button>
            <button id="," class="btn btn-primary col-3 m-2 py-4">
              <h2>,</h2>
            </button>
            <button id="=" class="btn btn-primary col-3 m-2 py-4">
              <h2>=</h2>
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
